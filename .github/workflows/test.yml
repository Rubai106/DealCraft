# DealCraft CI — runs the full regression on every push / pull request.
name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install system tools (pdftotext + Bengali font)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-core fonts-beng
      - name: Install Chrome for the PDF + hit-test checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
